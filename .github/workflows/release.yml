name: release

# A tag vX.Y.Z publishes dugout for macOS and Linux, amd64 and arm64, so
# nobody needs Go to install it. The tag must match the version in
# cmd/dugout/install.go and plugin/.claude-plugin/plugin.json: Claude Code
# caches the plugin by its version, and a binary that says otherwise would
# leave people on an old plugin. The tagged commit must be on main, tested and
# free of reachable vulnerabilities before anything is published. SHA256SUMS
# gets a build-provenance attestation, which `gh attestation verify` checks.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: tag matches the version
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"
      - name: test
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: build
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              name="dugout_${v}_${os}_${arch}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/$name/dugout" ./cmd/dugout
              cp LICENSE "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            done
          done
          (cd dist && sha256sum ./*.tar.gz >SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: the linux binary runs and says the tag
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$("dist/dugout_${v}_linux_amd64/dugout" version)" = "dugout $v" ]
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
