name: Bug report
description: Something in Dugout does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not file an issue: use **Report a vulnerability** under the Security tab (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps that show it, with the commands you ran.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: dugout doctor
      description: The output of `dugout version` and `dugout doctor`. Check it carries nothing you do not want public.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and version, `git --version`, Claude Code version, and whether you use a team server.
    validations:
      required: true
