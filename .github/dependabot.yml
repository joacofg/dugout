version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 3

  # The Dockerfile's base images and the compose file's (caddy).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
