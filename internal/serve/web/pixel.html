<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pixel office · Dugout</title>
<link rel="preload" href="/office/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/office/fonts.css">
<link rel="stylesheet" href="/office/pixel.css">
<script src="/office/client.js" defer></script>
<script src="/office/pixel-art.js" defer></script>
<script src="/office/pixel.js" defer></script>
</head>
<body>
<header class="top">
  <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15a9 9 0 0 1 18 0v3H3z" fill="#1b6c80"/><rect x="3" y="18" width="18" height="2" rx="1" fill="#131416"/></svg><span class="name">Dugout</span></span>
  <span class="crumb">Pixel office / <b id="crumb-repo"></b></span>
  <span class="spacer"></span>
  <label class="pick" hidden><span class="word">Repo</span> <select id="repo-select"></select></label>
  <span class="status" id="status" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="status-text">Connecting</span></span>
  <a class="view" id="to-clear" href="/office">Clear view</a>
</header>
<main class="sheet" id="main" tabindex="-1">
  <div class="titlerow"><h1 id="title">Connecting</h1><p class="sub" id="sub"></p></div>
  <div class="scene" id="scene"><canvas id="floor" role="img" aria-label="The office floor"></canvas><div id="finding" class="finding" hidden></div></div>
  <div class="legend" id="legend" aria-hidden="true"></div>
</main>
<div class="vh" id="announce" role="status" aria-live="polite"></div>
<noscript><p>The pixel office needs JavaScript.</p></noscript>
</body>
</html>
