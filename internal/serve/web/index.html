<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Office · Dugout</title>
<link rel="preload" href="/office/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/office/fonts.css">
<link rel="stylesheet" href="/office/app.css">
<script src="/office/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15a9 9 0 0 1 18 0v3H3z" fill="#1b6c80"/><rect x="3" y="18" width="18" height="2" rx="1" fill="#131416"/></svg>Dugout</div>
    <nav aria-labelledby="repos-label">
      <p class="navlabel" id="repos-label">Repos you see</p>
      <ul class="repos" id="repos"></ul>
    </nav>
  </aside>
  <header class="top">
    <span class="crumb">Office / <b id="crumb-repo"></b></span>
    <label class="pick">Repo <select id="repo-select"></select></label>
    <span class="status" id="status" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="status-text">Connecting</span></span>
  </header>
  <main class="sheet" id="main" tabindex="-1">
    <div class="state"><h1>Connecting</h1></div>
  </main>
</div>
<div class="vh" id="announce" role="status" aria-live="polite"></div>
<noscript><p>The office view needs JavaScript.</p></noscript>
</body>
</html>
